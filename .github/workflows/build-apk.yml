name: Build CEFR MASTER 60

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q CEFR_MASTER_60_phone_build.zip

      - name: Build APK
        working-directory: CEFR_MASTER_60
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: CEFR-MASTER-60-APK
          path: CEFR_MASTER_60/app/build/outputs/apk/debug/app-debug.apk
